name: Build

on:
  # Called by release-please.yml after it cuts a release: builds the
  # distributables and attaches them to the freshly-created GitHub Release.
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build for and attach artifacts to"
        required: true
        type: string
      kasas_version:
        description: "kasas release tag to bundle (or 'latest')"
        required: false
        default: "latest"
        type: string
  # Manual artifact-only build (no release publish) for spot-checking.
  workflow_dispatch:
    inputs:
      kasas_version:
        description: "kasas release tag to bundle (or 'latest')"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build macOS app
    # Apple-Silicon runner: produces an arm64 .dmg / .zip. The bundled kasas
    # binary is matched to the runner arch. (Universal/amd64 build is a follow-up.)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch bundled kasas binary
        # sillview bundles the kasas backend (forge `extraResource: resources/bin`).
        # Instead of building the sibling Go repo, pull the matching prebuilt
        # binary from the public kasas GitHub Release and verify its checksum.
        env:
          GH_TOKEN: ${{ github.token }}
          KASAS_VERSION: ${{ inputs.kasas_version }}
        run: |
          set -euo pipefail
          version="${KASAS_VERSION:-latest}"
          case "$(uname -m)" in
            arm64) arch=arm64 ;;
            x86_64) arch=amd64 ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          if [ "$version" = "latest" ]; then
            version="$(gh release view --repo paulmeier/kasas --json tagName -q .tagName)"
          fi
          asset="kasas_${version}_darwin_${arch}.tar.gz"
          echo "Downloading ${asset} from paulmeier/kasas…"
          tmp="$(mktemp -d)"
          # A release is tagged before its assets finish uploading, so a fresh
          # kasas release can briefly exist with no downloadable binary
          # ("no assets to download"). Retry to ride out that upload lag instead
          # of failing the whole release build.
          for attempt in 1 2 3 4 5 6; do
            if gh release download "$version" --repo paulmeier/kasas \
              --pattern "$asset" --pattern "${asset}.sha256" --dir "$tmp" --clobber; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "kasas ${version} assets still unavailable after ${attempt} attempts" >&2
              exit 1
            fi
            echo "kasas ${version} assets not ready (attempt ${attempt}); retrying in 30s…" >&2
            sleep 30
          done
          ( cd "$tmp" && shasum -a 256 -c "${asset}.sha256" )
          tar -C "$tmp" -xzf "$tmp/$asset"
          mkdir -p resources/bin
          cp "$tmp/kasas_${version}_darwin_${arch}/kasas" resources/bin/kasas
          chmod +x resources/bin/kasas
          echo "Bundled kasas ${version} (${arch})"

      - name: Build distributables
        # forge `make` on macOS runs only the darwin makers (DMG + ZIP); the
        # Windows/Linux makers are skipped on this host. The build is unsigned —
        # code signing + notarization are intentionally off (env-var opt-in).
        run: npm run make

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sillview-macos-arm64
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        # Only on the release path (workflow_call passes a tag); a manual
        # workflow_dispatch run just uploads the artifact above.
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # release-please already created the Release; fall back to creating it
          # if missing, then (re)upload the distributables. `--clobber` makes
          # re-runs idempotent.
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag
          # macOS runners ship bash 3.2, which has no `mapfile`; collect the
          # distributables with a portable read loop instead.
          assets=()
          while IFS= read -r f; do assets+=("$f"); done \
            < <(find out/make -type f \( -name '*.dmg' -o -name '*.zip' \))
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
