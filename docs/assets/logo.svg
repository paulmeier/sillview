<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sillview">
  <defs>
    <linearGradient id="sillBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b54e0"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#sillBg)"/>
  <!-- dashboard panes (the "view") -->
  <g fill="#ffffff" fill-opacity="0.16">
    <rect x="28" y="34" width="44" height="28" rx="6"/>
    <rect x="80" y="34" width="20" height="28" rx="6"/>
    <rect x="28" y="70" width="20" height="24" rx="6"/>
    <rect x="56" y="70" width="44" height="24" rx="6"/>
  </g>
  <!-- ascending bars in the big pane -->
  <g fill="#c4b5fd">
    <rect x="34" y="48" width="6" height="10" rx="2"/>
    <rect x="44" y="44" width="6" height="14" rx="2"/>
    <rect x="54" y="40" width="6" height="18" rx="2"/>
  </g>
  <!-- sparkline in the bottom-right pane -->
  <polyline points="60,86 70,80 80,84 90,76" fill="none" stroke="#c4b5fd"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
